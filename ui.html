<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        var(--figma-color-bg, #ffffff);

      color:
        var(--figma-color-text, #1e1e1e);
    }

    h2 {
      margin: 0 0 8px;

      font-size: 18px;
    }

    .description {
      margin-bottom: 18px;

      font-size: 12px;
      line-height: 1.6;

      color:
        var(--figma-color-text-secondary, #666666);
    }

    .notice {
      padding: 12px;

      margin-bottom: 16px;

      border-radius: 8px;

      background:
        var(--figma-color-bg-secondary, #f5f5f5);

      font-size: 12px;
      line-height: 1.6;
    }

    .options {
      display: flex;
      flex-direction: column;

      gap: 10px;

      margin-bottom: 18px;
    }

    label {
      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 12px;
    }

    .status {
      display: none;

      padding: 10px;

      margin-bottom: 12px;

      border-radius: 8px;

      font-size: 12px;
    }

    .status.show {
      display: block;
    }

    .success {
      background: #e7f7ed;
      color: #16823d;
    }

    .warning {
      background: #fff4dd;
      color: #9a6700;
    }

    .error {
      background: #fdebec;
      color: #b42335;
    }

    .buttons {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;
    }

    button {
      height: 36px;

      border-radius: 8px;

      border: 1px solid #d9d9d9;

      background: white;

      cursor: pointer;

      font-weight: 600;
    }

    #renameButton {
      border: none;

      background:
        var(--figma-color-bg-brand, #0d99ff);

      color: white;
    }
  </style>
</head>

<body>

  <h2>
    Layer Name to Hyphen
  </h2>

  <div class="description">
    선택한 Frame 안의 텍스트 레이어 이름을
    전부 <strong>-</strong> 로 변경합니다.
  </div>

  <div class="notice">
    <strong>화면에 보이는 실제 텍스트는 변경되지 않습니다.</strong>
    <br>
    왼쪽 Layers 패널에 표시되는 레이어 이름만 변경됩니다.
  </div>

  <div class="options">

    <label>
      <input
        type="checkbox"
        id="excludeHidden"
        checked
      >

      숨겨진 텍스트 레이어 제외
    </label>

    <label>
      <input
        type="checkbox"
        id="skipExisting"
        checked
      >

      이미 "-"인 레이어 제외
    </label>

  </div>

  <div
    id="status"
    class="status"
  ></div>

  <div class="buttons">

    <button id="closeButton">
      닫기
    </button>

    <button id="renameButton">
      레이어 이름 → -
    </button>

  </div>

<script>

const renameButton =
  document.getElementById(
    "renameButton"
  );

const closeButton =
  document.getElementById(
    "closeButton"
  );

const status =
  document.getElementById(
    "status"
  );


renameButton.onclick = () => {

  status.className =
    "status";

  status.textContent =
    "";


  parent.postMessage(
    {
      pluginMessage: {

        type: "rename",

        excludeHidden:
          document.getElementById(
            "excludeHidden"
          ).checked,

        skipExisting:
          document.getElementById(
            "skipExisting"
          ).checked

      }
    },

    "*"
  );

};


closeButton.onclick = () => {

  parent.postMessage(
    {
      pluginMessage: {
        type: "close"
      }
    },

    "*"
  );

};


onmessage = (event) => {

  const msg =
    event.data.pluginMessage;

  if (
    !msg ||
    msg.type !== "result"
  ) {
    return;
  }


  status.textContent =
    msg.message;


  status.className =
    `status show ${msg.status}`;

};

</script>

</body>
</html>
